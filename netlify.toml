[build]
  command = "npm run build"
  # Pula o build quando só mudou o que não entra no site (docs, .md, .sql,
  # scripts, .github, heartbeat-log.txt, .gitignore). Créditos da Netlify:
  # ver scripts/netlify/ignorar-build.mjs e docs/status-pingo-de-mell.md.
  ignore = "node scripts/netlify/ignorar-build.mjs"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Cabecalhos de seguranca (auditoria de 14/09/2026, item B20): NAO ficam
# aqui. O @netlify/plugin-nextjs nao repassa o bloco [[headers]] do
# netlify.toml pras respostas que o Next.js renderiza (confirmado testando
# contra o deploy real) — ver headers() em next.config.ts, que e o
# mecanismo que o plugin realmente honra.
