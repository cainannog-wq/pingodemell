name: Supabase Heartbeat

# Mantém o projeto Supabase ativo fazendo uma escrita real na tabela
# `heartbeat` a cada 3 dias (o plano gratuito pausa após 7 dias sem
# atividade de banco). Também pode ser disparado manualmente para teste.

on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Atualizar timestamp na tabela heartbeat
        env:
          SUPABASE_URL: https://npervqefspmwmrekskcb.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail

          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "NOW=$NOW" >> "$GITHUB_ENV"

          RESPONSE=$(curl -sS -w "\n%{http_code}" -X PATCH \
            "$SUPABASE_URL/rest/v1/heartbeat?id=eq.1" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "{\"pinged_at\": \"$NOW\"}")

          STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP status: $STATUS"
          echo "Resposta: $BODY"

          if [ "$STATUS" -ge 300 ]; then
            echo "::error::Falha ao atualizar heartbeat (status $STATUS)"
            exit 1
          fi

          if [ "$BODY" = "[]" ]; then
            echo "::error::Nenhuma linha foi atualizada. Confirme se a tabela heartbeat existe e tem a linha id=1."
            exit 1
          fi

          echo "Heartbeat atualizado com sucesso."

      - name: Registrar execução (commit automático)
        run: |
          set -euo pipefail

          # Commit próprio a cada execução conta como atividade no repositório,
          # o que evita que o GitHub desative este workflow agendado depois de
          # 60 dias sem nenhum commit (limite que é independente do Supabase).
          echo "Última execução do heartbeat: $NOW" > heartbeat-log.txt

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add heartbeat-log.txt

          if git diff --cached --quiet; then
            echo "Nada para commitar."
          else
            git commit -m "chore: heartbeat log $NOW"
            git push
          fi
